<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madame Cigogne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centred card over a lavender wash, with a needle gauge
     (blue ↔ pink, lavender in the middle) and Madame Cigogne, the stork who
     delivers babies. After each answer she takes the whole screen to give
     her verdict. Single deliberate light look: lavender is pink + blue. */
  :root {
    color-scheme: light;
    --wash: #ece6f4;        /* page ground: lavender */
    --paper: #fbf9fd;       /* card surface */
    --ink: #2a1e3b;         /* aubergine text */
    --muted: #6d6182;       /* secondary text, lavender-biased grey */
    --line: #ddd3ea;        /* hairlines */
    --gold: #e3a23b;        /* gold: sparkles, focus */
    --boy: #6fa7e0;
    --girl: #ee8fb8;
    --boy-deep: #2f6fae;
    --girl-deep: #c2427a;
    --bundle: #cfc1ea;
    --reveal: var(--gold);
    --reveal-deep: var(--ink);

    --f-display: "Gloock", "Iowan Old Style", Georgia, serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --step--1: .82rem;
    --step-0: 1rem;
    --step-1: 1.2rem;
    --step-2: 1.6rem;
    --step-3: clamp(2rem, 7vw, 2.7rem);
    --step-4: clamp(3rem, 14vw, 5.4rem);
  }
  :root[data-baby="girl"] { --reveal: var(--girl); --reveal-deep: var(--girl-deep); --wash: #f8e4ee; --bundle: var(--girl); }
  :root[data-baby="boy"]  { --reveal: var(--boy);  --reveal-deep: var(--boy-deep);  --wash: #e2edf8; --bundle: var(--boy); }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    background: var(--wash);
    color: var(--ink);
    font: 400 var(--step-0)/1.55 var(--f-body);
    transition: background-color 1.2s ease;
    overflow-x: hidden;
  }
  /* Two soft clouds: blue drifting in from one side, pink from the other. */
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; pointer-events: none;
    width: 70vmax; height: 70vmax; border-radius: 50%;
    filter: blur(60px); opacity: .55;
    animation: drift 18s ease-in-out infinite alternate;
  }
  body::before { background: radial-gradient(circle, var(--boy) 0%, transparent 65%); left: -35vmax; top: -25vmax; }
  body::after  { background: radial-gradient(circle, var(--girl) 0%, transparent 65%); right: -35vmax; bottom: -25vmax; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }

  main { max-width: 560px; margin: 0 auto; position: relative; }

  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: var(--step-1); letter-spacing: .01em; }
  .brand svg { width: 30px; height: 30px; flex: none; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--paper); color: var(--muted);
    border-radius: 99px; padding: 6px 12px; font: 500 var(--step--1) var(--f-body); cursor: pointer;
  }

  .card {
    background: var(--paper);
    border-radius: 28px;
    padding: clamp(22px, 5vw, 36px);
    box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 30px 60px -30px rgba(42,30,59,.35), 0 8px 20px -12px rgba(42,30,59,.2);
    position: relative;
  }
  .screen { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .eyebrow { font: 500 var(--step--1)/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; }
  h1, h2 { font-family: var(--f-display); font-weight: 400; line-height: 1.08; margin: 0 0 14px; text-wrap: balance; letter-spacing: -.01em; }
  h1 { font-size: var(--step-3); }
  h2 { font-size: var(--step-2); }
  p { margin: 0 0 14px; max-width: 62ch; }
  .muted { color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    border: 0; border-radius: 99px; cursor: pointer;
    padding: 15px 26px; min-height: 52px;
    font: 600 var(--step-0)/1.1 var(--f-body);
    background: var(--ink); color: var(--paper);
    box-shadow: 0 10px 22px -10px rgba(42,30,59,.6);
    transition: transform .15s, box-shadow .15s, opacity .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 26px -10px rgba(42,30,59,.6); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn[disabled] { opacity: .35; pointer-events: none; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn.wide { width: 100%; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }

  /* ---------- Madame Cigogne ---------- */
  .stork { display: block; width: 100%; height: auto; overflow: visible; }
  .stork .bob { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .stork .turn { transform-box: view-box; transform-origin: 110px 120px; transition: transform .55s cubic-bezier(.34,1.56,.64,1); }
  .stork.look-girl .turn { transform: scaleX(-1) rotate(-6deg); }
  .stork.look-boy .turn { transform: rotate(-6deg); }
  .stork .head { transform-box: view-box; transform-origin: 104px 116px; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
  .stork .wing { transform-box: view-box; transform-origin: 120px 118px; transition: transform .45s cubic-bezier(.34,1.56,.64,1); }
  .stork .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .stork .q { transform-box: fill-box; transform-origin: center; transition: transform .55s; }
  .stork.look-girl .q { transform: scaleX(-1); }
  .stork.thinking .head { animation: ponder 1.1s ease-in-out infinite alternate; }
  @keyframes ponder { from { transform: rotate(6deg); } to { transform: rotate(-10deg); } }
  .stork.look-boy .wing, .stork.look-girl .wing { transform: rotate(-24deg); }
  .stork.shock .bob { animation: shake .09s linear 8; }
  .stork.shock .eye { animation: none; transform: scale(1.5); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .stork.shrug .head { animation: shrug 1.4s ease-in-out infinite; }
  .stork.shrug .wing { animation: flap .7s ease-in-out infinite alternate; }
  @keyframes shrug { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-12deg); } }
  .stork.happy .bob { animation: hop .7s cubic-bezier(.3,0,.4,1) infinite alternate; }
  .stork.happy .wing { animation: flap .35s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-16px); } }
  @keyframes flap { from { transform: rotate(0deg); } to { transform: rotate(-38deg); } }
  .bundle { fill: var(--bundle); transition: fill 1.2s; }
  .stork .jaw { transform-box: view-box; transform-origin: 63px 59px; }
  .stork.talking .jaw { animation: jaw .16s ease-in-out infinite alternate; }
  @keyframes jaw { to { transform: rotate(-16deg); } }

  .card-stork { width: 132px; margin: -8px auto 6px; }

  /* ---------- gauge ---------- */
  .gauge-wrap { margin: -4px 0 18px; }
  .gauge { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; overflow: visible; }
  .gauge .needle { transform-origin: 160px 150px; transition: transform 1.1s cubic-bezier(.34,1.56,.64,1); }
  .gauge .needle.wild { transition: transform .38s cubic-bezier(.45,0,.55,1); }
  .gauge text { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; fill: var(--muted); }
  .readout {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    max-width: 360px; margin: 6px auto 0;
    font: 500 var(--step--1) var(--f-mono); color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .readout b { font-weight: 500; color: var(--ink); }
  .progress { display: flex; gap: 5px; margin: 0 0 22px; }
  .progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .4s; }
  .progress i.done { background: linear-gradient(90deg, var(--boy), var(--girl)); }

  /* ---------- options ---------- */
  .options { display: grid; gap: 10px; margin-top: 8px; }
  @media (min-width: 520px) { .options.two { grid-template-columns: 1fr 1fr; } }
  .opt {
    display: flex; align-items: center; gap: 14px; text-align: left;
    width: 100%; padding: 14px 16px; border-radius: 18px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
    font: 500 var(--step-0)/1.3 var(--f-body);
    transition: border-color .15s, transform .15s, background .2s;
  }
  .opt:hover { border-color: var(--muted); transform: translateY(-1px); }
  .opt .glyph { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--wash); font-size: 1.25rem; }
  .opt span:last-child { min-width: 0; }
  .opt.picked { border-color: var(--ink); background: #f4effa; }
  .options.locked .opt:not(.picked) { opacity: .4; pointer-events: none; }
  .options.locked .opt.picked { pointer-events: none; }

  /* ---------- the stork's verdict, full screen ---------- */
  .ov {
    position: fixed; inset: 0; z-index: 5; overflow-y: auto;
    display: flex; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: rgba(42,30,59,.5);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    animation: fade .35s both;
  }
  .ov.closing { animation: fade .3s reverse both; }
  @keyframes fade { from { opacity: 0; } }
  .ov-panel {
    margin: auto; width: 100%; max-width: 420px;
    background: var(--paper); border-radius: 32px; padding: 22px 22px 24px;
    box-shadow: 0 40px 80px -30px rgba(20,10,35,.6);
    animation: zoom .5s cubic-bezier(.34,1.56,.64,1) both;
    position: relative; overflow: hidden;
  }
  @keyframes zoom { from { opacity: 0; transform: scale(.85) translateY(20px); } }
  .ov-panel::before {
    content: ""; position: absolute; left: 50%; top: -60px; width: 340px; height: 340px; margin-left: -170px;
    border-radius: 50%; pointer-events: none; transition: background .6s;
    background: radial-gradient(circle, #f1eaf9 0%, transparent 70%);
  }
  .ov-panel[data-lean="boy"]::before  { background: radial-gradient(circle, #d5e6f7 0%, transparent 70%); }
  .ov-panel[data-lean="girl"]::before { background: radial-gradient(circle, #fadbe8 0%, transparent 70%); }
  .ov-stork { width: 190px; margin: 0 auto; position: relative; }
  .bubble {
    position: relative; margin: 6px 0 14px; padding: 16px 18px; border-radius: 22px;
    background: var(--wash); min-height: 64px;
    font-size: var(--step-1); line-height: 1.45;
  }
  .bubble::before {
    content: ""; position: absolute; top: -9px; left: 50%; margin-left: -10px;
    border: 10px solid transparent; border-top: 0; border-bottom-color: var(--wash);
  }
  .bubble .tag { display: block; font: 500 var(--step--1) var(--f-mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .bubble .tag.boy { color: var(--boy-deep); }
  .bubble .tag.girl { color: var(--girl-deep); }
  .bubble .tag.none { color: var(--muted); }
  .bubble .say { animation: rise .4s both; display: block; }
  .dots { display: flex; justify-content: center; gap: 8px; padding: 10px 0; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); animation: dot 1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-7px); opacity: .4; } }
  .correction {
    margin-top: 12px; padding: 12px 14px; border-radius: 16px;
    border: 1.5px dashed var(--gold); background: #fff8ec;
    font-size: var(--step--1); animation: rise .45s both;
  }
  .correction strong { font-family: var(--f-mono); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #9a6411; display: block; margin-bottom: 2px; }
  .ov .gauge { max-width: 250px; }
  .ov .readout { max-width: 250px; }
  .ov .gauge-wrap { margin: 0; }
  .ov-actions { margin-top: 18px; min-height: 52px; }
  .ov-actions .btn { animation: rise .4s both; }

  /* ---------- slider ---------- */
  .slider-box { margin: 18px 0 6px; }
  .big-num { font: 400 var(--step-4)/1 var(--f-display); text-align: center; font-variant-numeric: tabular-nums; }
  .big-num small { display: block; font: 500 var(--step--1) var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  input[type=range] { width: 100%; margin: 18px 0 4px; accent-color: var(--ink); height: 28px; }
  .ticks { display: flex; justify-content: space-between; font: 400 var(--step--1) var(--f-mono); color: var(--muted); }

  /* ---------- ring test ---------- */
  .ring-stage { position: relative; height: 240px; margin: 8px 0 4px; display: grid; place-items: start center; }
  .pendulum { transform-origin: 50% 0; width: 60px; height: 200px; position: relative; }
  .pendulum .string { position: absolute; left: 50%; top: 0; width: 1.5px; height: 160px; background: var(--muted); transform: translateX(-50%); }
  .pendulum .ring {
    position: absolute; left: 50%; top: 152px; width: 38px; height: 38px; margin-left: -19px;
    border-radius: 50%; border: 6px solid var(--gold);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), 0 6px 10px -4px rgba(42,30,59,.35);
  }
  .bump {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 180px; height: 46px; border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    background: linear-gradient(90deg, var(--boy), #c7b5e6, var(--girl)); opacity: .5;
  }
  .pendulum.line   { animation: swing-line 1.1s ease-in-out infinite alternate; }
  .pendulum.circle { animation: swing-circle 1.3s linear infinite; }
  @keyframes swing-line { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
  @keyframes swing-circle {
    0%   { transform: rotate(18deg) scale(1); }
    25%  { transform: rotate(0deg) scale(1.12); }
    50%  { transform: rotate(-18deg) scale(1); }
    75%  { transform: rotate(0deg) scale(.88); }
    100% { transform: rotate(18deg) scale(1); }
  }
  .ring-status { text-align: center; font: 500 var(--step--1) var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-height: 1.4em; }

  /* ---------- computing ---------- */
  .log { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; font: 400 var(--step--1)/1.4 var(--f-mono); color: var(--muted); }
  .log li { display: flex; gap: 10px; animation: rise .35s both; }
  .log li::before { content: "◦"; color: var(--gold); }
  .log li.ok::before { content: "✓"; }

  /* ---------- scratch card ---------- */
  .scratch {
    position: relative; width: min(100%, 340px); aspect-ratio: 1; max-width: 100%;
    margin: 18px auto 8px; border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 0 0 10px var(--paper), 0 0 0 11px var(--line), 0 30px 50px -25px rgba(42,30,59,.5);
  }
  .scratch .under {
    position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; text-align: center;
    background: radial-gradient(circle at 50% 40%, #fff 0%, var(--reveal) 140%);
  }
  .scratch .under .word { font: 400 clamp(2.6rem, 14vw, 4.2rem)/1 var(--f-display); color: var(--reveal-deep); }
  .scratch .under small { display: block; font: 500 var(--step--1) var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--reveal-deep); margin-bottom: 6px; }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; touch-action: none; cursor: grab; transition: opacity .8s; }
  .scratch canvas.gone { opacity: 0; pointer-events: none; }
  .hint { text-align: center; font: 500 var(--step--1) var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* ---------- reveal ---------- */
  .reveal-head { text-align: center; }
  .reveal-head .its { font: 500 var(--step-0) var(--f-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--reveal-deep); }
  .reveal-head .word { font: 400 var(--step-4)/.95 var(--f-display); color: var(--reveal-deep); margin: 6px 0 12px; display: flex; justify-content: center; flex-wrap: wrap; }
  .reveal-head .word span { display: inline-block; animation: pop .7s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(40px) scale(.4) rotate(-10deg); } }
  .letter { margin-top: 20px; padding: 20px 22px; border-radius: 20px; background: var(--wash); font-size: var(--step-1); line-height: 1.5; transition: background 1.2s; }
  .letter .sig { display: block; margin-top: 10px; font: 400 var(--step-1) var(--f-display); color: var(--reveal-deep); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .stats div { padding: 12px 6px; border-radius: 16px; border: 1px solid var(--line); text-align: center; }
  .stats b { display: block; font: 400 var(--step-2)/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
  .stats span { font: 500 .7rem/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  /* ---------- setup ---------- */
  .field { display: grid; gap: 6px; margin-bottom: 16px; }
  .field label, .field legend { font: 600 var(--step--1) var(--f-body); color: var(--muted); padding: 0; }
  .field input[type=text], .field textarea {
    width: 100%; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); font: 400 var(--step-0)/1.4 var(--f-body);
  }
  .field textarea { min-height: 92px; resize: vertical; }
  fieldset.field { border: 0; margin: 0 0 16px; padding: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; }
  .seg span { display: block; text-align: center; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); font: 600 var(--step-0) var(--f-body); color: var(--ink); cursor: pointer; background: #fff; }
  .seg input:checked + span.b { background: var(--boy); border-color: var(--boy-deep); }
  .seg input:checked + span.g { background: var(--girl); border-color: var(--girl-deep); }
  .seg input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
  .linkbox { margin-top: 18px; padding: 16px; border-radius: 16px; background: var(--wash); display: grid; gap: 10px; }
  .linkbox code { font: 400 .8rem/1.4 var(--f-mono); word-break: break-all; color: var(--ink); }
  .note { font-size: var(--step--1); color: var(--muted); margin: 0; }
  .err { color: var(--girl-deep); font-weight: 600; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .pendulum.line, .pendulum.circle { animation: none; }
  }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="bg1" x1="0" x2="1"><stop offset="0" stop-color="#6fa7e0"/><stop offset="1" stop-color="#ee8fb8"/></linearGradient></defs>
        <circle cx="16" cy="16" r="14" fill="url(#bg1)"/>
        <circle cx="18" cy="13" r="5" fill="#fbf9fd"/>
        <path d="M14 13.5 L5 17 L14 15.5 Z" fill="#ef9a45"/>
        <circle cx="17" cy="12" r="1" fill="#2a1e3b"/>
        <path d="M18 18 Q14 24 20 26" fill="none" stroke="#fbf9fd" stroke-width="3" stroke-linecap="round"/>
      </svg>
      Madame Cigogne
    </div>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">♪ Son activé</button>
  </header>
  <section class="card" id="stage" aria-live="polite"></section>
</main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  'use strict';

  /* =========================================================
     Le sexe du bébé n'est jamais écrit dans ce fichier.
     L'écran de préparation le range, avec les prénoms et le
     message, dans un code brouillé : soit dans le #hash d'un
     lien, soit directement en mémoire pour jouer sur place.
     ========================================================= */
  const KEY = 'little-one-2026';
  const enc = (obj) => {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    const out = bytes.map((b, i) => b ^ KEY.charCodeAt(i % KEY.length) ^ (i * 7 & 255));
    let s = ''; out.forEach(b => s += String.fromCharCode(b));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const dec = (code) => {
    try {
      const s = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
      const bytes = Uint8Array.from(s, (c, i) => c.charCodeAt(0) ^ KEY.charCodeAt(i % KEY.length) ^ (i * 7 & 255));
      const obj = JSON.parse(new TextDecoder().decode(bytes));

      <div class="ring-stage"><div class="pendulum" id="pend"><div class="string"></div><div class="ring"></div></div><div class="bump"></div></div>
      <p class="ring-status" id="rs">L'alliance attend</p>
      <div class="actions"><button class="btn wide" id="ringGo" type="button">Faire descendre l'alliance</button></div></div>`);
    $('#ringGo', stage).addEventListener('click', async (e) => {
      e.currentTarget.parentElement.remove();
      const pend = $('#pend', stage), rs = $('#rs', stage);
      const first = Math.random() < .5 ? 'line' : 'circle';
      const other = first === 'line' ? 'circle' : 'line';
      const flips = Math.random() < .45;
      rs.textContent = 'Lecture de l’oscillation…';
      pend.className = 'pendulum ' + first; tone(880, .4, 'sine', .05);
      await wait(2600);
      let final = first;
      if (flips) {
        rs.textContent = 'Attends… elle change de direction…';
        pend.className = 'pendulum ' + other; tone(440, .4, 'sine', .05);
        await wait(2400);
        final = 'both';
      }
      pend.className = 'pendulum';
      rs.textContent = final === 'both' ? 'Elle a fait les deux' : final === 'line' ? 'Une ligne droite' : 'Un cercle';
      await wait(500);
      if (final === 'both') record(0, 'L\'alliance a fait une ligne, puis un cercle. Elle fait exprès de ne pas aider.');
      else if (final === 'line') record(-28, 'Une belle ligne droite. Toutes les grands-mères sont d\'accord : garçon. (Grands-mères interrogées : une.)');
      else record(28, 'Un joli cercle. Fille, affirme l\'alliance, avec une confiance totale et aucune preuve.');
    });
  }

  /* ---------------- verdict final : l'aiguille s'affole ---------------- */
  async function renderComputing() {
    set(stage, `<div class="screen">
      <div class="card-stork">${stork('thinking')}</div>
      ${gaugeSVG()}
      <p class="eyebrow">Calcul en cours</p>
      <h2>Madame Cigogne réfléchit très fort</h2>
      <ul class="log" id="log"></ul></div>`);
    const log = $('#log', stage);
    const lines = [
      'J\'additionne les envies, le teint et les pieds',
      'Je consulte trois grands-mères et un chat',
      'Je vérifie la phase de la lune',
      'Je recompte les pipis de la nuit',
      'Je refais le test de l\'alliance, pour la science',
      'Je réconcilie des preuves contradictoires',
    ];
    drumroll(reduced ? 600 : 7600);
    say('Laisse-moi réfléchir. Je consulte trois grands-mères et un chat. Je vérifie la phase de la lune. Je recompte les pipis de la nuit.');
    for (const l of lines) {
      const li = document.createElement('li'); li.textContent = l + '…'; log.appendChild(li);
      for (let k = 0; k < 3; k++) {
        const v = (Math.random() * 2 - 1) * 95;
        setNeedle(v, true);
        setStork(stage, v > 0 ? 'look-girl' : 'look-boy');
        await wait(400);
      }
      li.classList.add('ok');
    }
    setStork(stage, 'thinking');
    setNeedle(0); await wait(1300);
    set(stage, `<div class="screen">
      <div class="card-stork">${stork('shrug')}</div>
      ${gaugeSVG()}
      <p class="eyebrow">Verdict officiel</p>
      <h1>Exactement 50 / 50.</h1>
      <p>Après ${Q.length} questions, un test de l'alliance et deux corrections, la science est parfaitement équilibrée. Madame Cigogne donne sa langue au chat.</p>
      <p class="muted">Heureusement, quelqu'un connaît déjà la réponse. Elle est cachée dans le petit paquet que Madame Cigogne transporte.</p>
      <div class="actions"><button class="btn wide" id="openEnv" type="button">Ouvrir le paquet</button></div></div>`);
    say('Exactement cinquante, cinquante ! Je donne ma langue au chat. Heureusement, la réponse est cachée dans mon petit paquet.');
    $('#openEnv', stage).addEventListener('click', () => { blip(); renderScratch(); });
  }

  /* ---------------- carte à gratter ---------------- */
  function renderScratch() {
    const girl = cfg.s === 'g';
    set(stage, `<div class="screen">
      <p class="eyebrow">Pour ${esc(cfg.n || 'toi')}, de la part de ${esc(cfg.f || 'moi')}</p>
      <h2>Gratte le sceau pour découvrir</h2>
      <div class="scratch" id="sc">
        <div class="under" aria-hidden="true"><div><small>${girl ? 'C\'est une' : 'C\'est un'}</small><div class="word">${girl ? 'Fille' : 'Garçon'}</div></div></div>
        <canvas id="scr" aria-label="Zone à gratter : fais glisser ton doigt dessus"></canvas>
      </div>
      <p class="hint" id="hint">Gratte avec ton doigt</p>
      <div class="actions" style="justify-content:center"><button class="btn ghost" id="skip" type="button">Révèle-le pour moi</button></div></div>`);

    say('Gratte le sceau avec ton doigt !');
    const sc = $('#sc', stage), cv = $('#scr', stage), ctx = cv.getContext('2d', { willReadFrequently: true });
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const size = sc.clientWidth;
    cv.width = cv.height = Math.round(size * dpr);
    ctx.scale(dpr, dpr);

    // feuille : le même bleu → lavande → rose que la jauge, avec des paillettes dorées
    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#9cc2ea'); g.addColorStop(.5, '#cfc1ea'); g.addColorStop(1, '#f2b2cf');
    ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
    for (let i = 0; i < 260; i++) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * .5})`;
      ctx.beginPath(); ctx.arc(Math.random() * size, Math.random() * size, Math.random() * 1.8, 0, 7); ctx.fill();
    }
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = `rgba(227,162,59,${.4 + Math.random() * .5})`;
      const x = Math.random() * size, y = Math.random() * size, r = 1 + Math.random() * 2.5;
      ctx.beginPath(); ctx.moveTo(x, y - r * 2); ctx.lineTo(x + r * .6, y); ctx.lineTo(x, y + r * 2); ctx.lineTo(x - r * .6, y); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(42,30,59,.75)'; ctx.textAlign = 'center';
    ctx.font = `400 ${size * .1}px Gloock, Georgia, serif`;
    ctx.fillText('?', size / 2, size * .47);
    ctx.font = `500 ${size * .04}px "DM Mono", monospace`;
    ctx.fillText('GRATTE ICI', size / 2, size * .58);

    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = size * .14;

    let down = false, last = null, moves = 0, done = false;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const scratchAt = (p) => {
      ctx.beginPath();
      if (last) { ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      else { ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, 7); ctx.fill(); }
      last = p;
      if (++moves % 6 === 0) { tone(1800 + Math.random() * 1400, .03, 'square', .015); check(); }
    };
    const check = () => {
      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      let clear = 0, total = 0;
      for (let i = 3; i < data.length; i += 4 * 37) { total++; if (data[i] < 40) clear++; }
      if (clear / total > .42) finish();
    };
    const finish = () => {
      if (done) return; done = true;
      cv.classList.add('gone'); $('#hint', stage).textContent = '';
      const sk = $('#skip', stage); if (sk) sk.parentElement.remove();
      celebrate();
    };
    cv.addEventListener('pointerdown', (e) => { down = true; last = null; cv.setPointerCapture(e.pointerId); scratchAt(pos(e)); });
    cv.addEventListener('pointermove', (e) => { if (down) scratchAt(pos(e)); });
    const up = () => { down = false; last = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    $('#skip', stage).addEventListener('click', finish);
  }

  /* ---------------- la fête ---------------- */
  async function celebrate() {
    const girl = cfg.s === 'g';
    document.documentElement.dataset.baby = girl ? 'girl' : 'boy';
    fanfare();
    confetti(girl);
    await wait(1600);
    setTimeout(() => say(`${girl ? 'C\'est une fille' : 'C\'est un garçon'} ! Félicitations${cfg.n ? ' ' + cfg.n : ''} !`), 400);
    const word = girl ? 'FILLE' : 'GARÇON';
    const msg = cfg.m ? esc(cfg.m).replace(/\n/g, '<br>') : (girl
      ? 'Notre petite fille arrive. J\'ai tellement hâte de la rencontrer avec toi.'
      : 'Notre petit garçon arrive. J\'ai tellement hâte de le rencontrer avec toi.');
    const totals = answers.reduce((a, x) => (x.d > 0 ? a.g++ : x.d < 0 ? a.b++ : a.n++, a), { g: 0, b: 0, n: 0 });
    set(stage, `<div class="screen">
      <div class="card-stork">${stork('happy ' + (girl ? 'look-girl' : 'look-boy'))}</div>
      <div class="reveal-head">
        <div class="its">${girl ? 'C\'est une' : 'C\'est un'}</div>
        <div class="word" aria-label="${word}">${[...word].map((c, i) => `<span style="animation-delay:${i * .12}s">${c}</span>`).join('')}</div>
      </div>
      <div class="letter">${msg}${cfg.f ? `<span class="sig">${esc(cfg.f)}</span>` : ''}</div>
      <p class="eyebrow" style="margin-top:22px">Le bilan de Madame Cigogne</p>
      <div class="stats">
        <div><b>${totals.b}</b><span>Disait garçon</span></div>
        <div><b>${totals.g}</b><span>Disait fille</span></div>
        <div><b>${totals.n}</b><span>Indécise</span></div>
      </div>
      <p class="muted" style="margin-top:14px">Aucun de ces symptômes ne veut rien dire. Madame Cigogne a tout inventé. Le seul test fiable, c'était son petit paquet.</p>
      <div class="actions"><button class="btn" id="more" type="button">Encore des confettis</button><button class="btn ghost" id="again" type="button">Rejouer</button></div>
    </div>`);
    // the bundle swaps its "?" for a heart
    $$('.stork .q', stage).forEach(q => q.textContent = '♥');
    $('#more', stage).addEventListener('click', () => { confetti(girl); fanfare(); });
    $('#again', stage).addEventListener('click', () => { delete document.documentElement.dataset.baby; start(); });
  }

  const cc = $('#confetti'), cctx = cc.getContext('2d');
  let parts = [], raf = 0;
  function confetti(girl) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cc.width = innerWidth * dpr; cc.height = innerHeight * dpr; cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pal = girl ? ['#ee8fb8', '#f6b8d2', '#c2427a', '#ffffff', '#e3a23b', '#fbd3e3']
                     : ['#6fa7e0', '#a9cdf1', '#2f6fae', '#ffffff', '#e3a23b', '#d4e6f8'];
    const count = reduced ? 60 : 260;
    for (let i = 0; i < count; i++) {
      const fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? -10 : innerWidth + 10, y: innerHeight * (.55 + Math.random() * .3),
        vx: (fromLeft ? 1 : -1) * (4 + Math.random() * 9), vy: -(9 + Math.random() * 11),
        w: 6 + Math.random() * 8, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
        c: pal[i % pal.length], shape: i % 7 === 0 ? 'heart' : i % 3 === 0 ? 'dot' : 'rect', life: 0,
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function heart(ctx, s) {
    ctx.beginPath(); ctx.moveTo(0, s * .3);
    ctx.bezierCurveTo(-s, -s * .4, -s * .4, -s, 0, -s * .35);
    ctx.bezierCurveTo(s * .4, -s, s, -s * .4, 0, s * .3); ctx.fill();
  }
  function tick() {
    cctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 600);
    for (const p of parts) {
      p.life++; p.vy += .28; p.vx *= .985; p.vy *= .985; p.x += p.vx + Math.sin(p.life / 12) * .6; p.y += p.vy; p.r += p.vr;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r); cctx.fillStyle = p.c;
      if (p.shape === 'rect') { cctx.scale(1, Math.cos(p.life / 6)); cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      else if (p.shape === 'dot') { cctx.beginPath(); cctx.arc(0, 0, p.h / 1.6, 0, 7); cctx.fill(); }
      else heart(cctx, p.w * .9);
      cctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  /* ---------------- écrans ---------------- */
  function render() {
    window.scrollTo({ top: 0, behavior: 'auto' });
    if (step >= Q.length) return renderComputing();
    const item = Q[step];
    if (item.type === 'slider') return renderSlider(item);
    if (item.type === 'ring') return renderRing(item);
    renderChoice(item);
  }

  function start() {
    answers = []; step = 0; value = 0;
    const name = cfg.n ? esc(cfg.n) : 'toi';
    set(stage, `<div class="screen">
      <div class="card-stork">${stork()}</div>
      <p class="eyebrow">Livreuse de bébés · Experte autoproclamée</p>
      <h1>Bonjour ${name}. Madame Cigogne va lire ton ventre.</h1>
      <p>Depuis des siècles, on devine le sexe du bébé grâce aux envies, aux pieds gonflés et à une alliance au bout d'un fil. Madame Cigogne, qui livre les bébés depuis toujours, a rassemblé toute cette sagesse dans une méthode parfaitement non scientifique.</p>
      <p class="muted">Réponds honnêtement aux ${Q.length} questions et surveille l'aiguille. À la fin, elle te dira si c'est un garçon ou une fille.</p>
      <div class="actions"><button class="btn wide" id="go" type="button">Commencer</button></div>
    </div>`);
    say(`Bonjour ${cfg.n || ''} ! Je suis Madame Cigogne. Je livre les bébés depuis toujours, et je vais lire ton ventre.`);
    $('#go', stage).addEventListener('click', () => { blip(); render(); });
  }

  function setup(error) {
    set(stage, `<div class="screen">
      <p class="eyebrow">Pour celui qui sait · Préparation</p>
      <h1>Prépare la surprise</h1>
      <p class="muted">Remplis ceci en secret, puis lance le jeu sur ce téléphone et donne-le-lui. Rien à l'écran ne trahit la réponse avant la toute fin.</p>
      ${error ? `<p class="err">${esc(error)}</p>` : ''}
      <form id="sf" autocomplete="off">
        <fieldset class="field"><legend>Le bébé est…</legend>
          <div class="seg">
            <label><input type="radio" name="sex" id="sexB" value="b" required><span class="b">Garçon</span></label>
            <label><input type="radio" name="sex" id="sexG" value="g"><span class="g">Fille</span></label>
          </div>
        </fieldset>
        <div class="field"><label for="her">Son prénom</label><input type="text" id="her" maxlength="40" placeholder="ex. Amira"></div>
        <div class="field"><label for="you">Ton prénom (pour signer le message)</label><input type="text" id="you" maxlength="40" placeholder="ex. Firas"></div>
        <div class="field"><label for="msg">Un message affiché après la révélation (facultatif)</label><textarea id="msg" maxlength="400" placeholder="Laisse vide pour un court message par défaut"></textarea></div>
        <button class="btn wide" type="submit">Préparer</button>
      </form>
      <div id="out"></div>
    </div>`);
    $('#sf', stage).addEventListener('submit', (e) => {
      e.preventDefault();
      const s = $('input[name=sex]:checked', stage)?.value;
      if (!s) return;
      const code = enc({ s, n: $('#her', stage).value.trim(), f: $('#you', stage).value.trim(), m: $('#msg', stage).value.trim() });
      const cfgNew = dec(code);
      let framed = true;
      try { framed = window.self !== window.top; } catch {}
      const url = location.href.split('#')[0].split('?')[0] + '#' + code;
      set($('#out', stage), `<div class="linkbox">
        <strong>C'est prêt</strong>
        <button class="btn wide" id="here" type="button">Lancer le jeu sur ce téléphone</button>
        <p class="note">L'écran de préparation disparaît et le jeu s'ouvre sur l'accueil. Tu peux lui donner le téléphone : la réponse n'apparaît qu'à la toute fin.</p>
        ${framed ? '' : `<p class="note" style="margin-top:6px">Ou envoie-lui ce lien pour jouer sur son propre téléphone :</p>
        <code id="lnk">${esc(url)}</code>
        <div class="actions" style="margin-top:4px"><button class="btn ghost" id="copy" type="button">Copier le lien</button></div>`}
      </div>`);
      $('#here', stage).addEventListener('click', () => { cfg = cfgNew; blip(); start(); window.scrollTo(0, 0); });
      const cp = $('#copy', stage);
      if (cp) cp.addEventListener('click', async (ev) => {
        const b = ev.currentTarget;
        try { await navigator.clipboard.writeText(url); b.textContent = 'Copié'; }
        catch { const r = document.createRange(); r.selectNodeContents($('#lnk', stage)); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = 'Sélectionné, copie-le'; }
      });
      $('#here', stage).scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
    });
  }

  function boot() {
    const h = location.hash.slice(1);
    if (!h || h === 'setup') { cfg = null; return setup(); }
    cfg = dec(h);
    if (!cfg) return setup('Ce lien semble abîmé. Prépare-en un nouveau ci-dessous.');
    start();
  }
  addEventListener('hashchange', boot);
  boot();
})();
</script>
</body>
</html>
